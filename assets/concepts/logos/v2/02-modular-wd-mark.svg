    <g id="modular-wd-v2-left-pointing-sword" transform="rotate(-42 128 128)">
      <path fill="#E6EDDF" d="M128 22L140 47V170L128 181L116 170V47Z"/>
      <path fill="none" stroke="#3E5949" stroke-width="2.5" d="M128 46V173"/>
      <path fill="#617340" d="M104 176H152V184L146 190H136V211L128 220L120 211V190H110L104 184Z"/>
      <path fill="#090E0B" d="M121 193H135V197H121ZM121 203H135V207H121Z"/>
    </g>
  </g>
  <g id="modular-wd-v2-letter-panels" stroke="#090E0B" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">
    <path id="modular-wd-v2-letter-w" fill="#8AAD45" d="M47 73H66L73 150L86 116H104L117 150L123 73H142L132 190H112L95 146L78 190H58Z"/>
