    <path fill="#090E0B" d="M43 15H213L241 43V213L213 241H43L15 213V43Z"/>
    <path fill="none" stroke="#3E5949" stroke-width="5" d="M46 28H210L228 46V210L210 228H46L28 210V46Z"/>
  </g>
  <g id="modular-wd-v2-armored-side-rails" fill="#3E5949">
