      <path fill="#E6EDDF" d="M128 22L140 47V170L128 181L116 170V47Z"/>
      <path fill="none" stroke="#3E5949" stroke-width="2.5" d="M128 46V173"/>
      <path fill="#617340" d="M104 176H152V184L146 190H136V211L128 220L120 211V190H110L104 184Z"/>
      <path fill="#090E0B" d="M121 193H135V197H121ZM121 203H135V207H121Z"/>
