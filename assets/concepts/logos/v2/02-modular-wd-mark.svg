<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="modular-wd-v2-mark-title modular-wd-v2-mark-description">
  <title id="modular-wd-v2-mark-title">Weapon Database — Modular WD Blade Mark</title>
  <desc id="modular-wd-v2-mark-description">A green WD armor-panel monogram layered over two crossed silver swords on a black clipped vault plate. Targeting brackets, armored side rails, and three finish swatches frame the customizable armory identity.</desc>
