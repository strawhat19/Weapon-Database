  <title id="armory-crest-v12-green-border-mark-title">Weapon Database — Green Border Armory Crest</title>
  <desc id="armory-crest-v12-green-border-mark-description">The Weapon Database armory crest uses a predominantly tactical green shield border with narrow gunmetal recessed strips and small dark silver highlights, retaining its black border seams and tiny muted red inlays. Both border variants preserve field olive rifle shells with dark silver hardware, gray bow and arrow details, a gunmetal sword handle, gray rear aircraft panels, blended rifle-over-sword layering, and black scope separation gaps.</desc>
