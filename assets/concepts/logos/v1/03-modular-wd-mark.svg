  <title id="modular-wd-mark-title">Weapon Database — Modular WD Mark</title>
  <desc id="modular-wd-mark-description">An original WD monogram built from olive and tactical green armor panels inside a black clipped-corner plate. Three small finish swatches suggest interchangeable weapon skins and camouflage.</desc>
