<title id="crest-title">Weapon Database Armory Crest — v16</title>
<desc id="crest-description">Refined armory crest with a green shield, centered sword, exactly mirrored rifles and segmented scope, a bow and arrow at upper left, and a symmetrical jet at upper right. Native vector geometry uses the selected v15 colors. The surrounding canvas is transparent.</desc>
