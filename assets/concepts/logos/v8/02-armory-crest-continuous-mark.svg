  <title id="armory-crest-v8-continuous-mark-title">Weapon Database — Armory Crest Continuous Sword</title>
  <desc id="armory-crest-v8-continuous-mark-description">The armory crest has a single upright silver sword blade visibly continuing across the crossed green rifles to its silver crossguard. A narrow black contour and shortened scope spokes separate the continuous blade from the rifles and silver reticle. The silver aircraft gains subtle green tailplane and exhaust inlays, retaining its red canopy and black seams; the shield, bow, arrow, grip, and pommel retain their prior details.</desc>
